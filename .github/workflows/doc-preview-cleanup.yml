name: Documentation preview cleanup

on:
  pull_request:
    types: [closed]

concurrency:
  group: documentation-gh-pages
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: gh-pages

      - name: Remove closed PR preview
        env:
          PREVIEW_DIR: previews/PR${{ github.event.pull_request.number }}
        run: |
          if [ -d "$PREVIEW_DIR" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm -r -- "$PREVIEW_DIR"
            git commit -m "Remove documentation preview for closed PR"
            git push origin HEAD:gh-pages
          fi
